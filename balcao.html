<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOOBA! — Balcão</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="balcao.css">
</head>
<body>

  <!-- ===== HEADER (mesma identidade visual do cardápio) ===== -->
  <header class="header balcao-header">
    <nav class="nav container">
      <span class="nav__logo">AOOBA! <span class="balcao-header__tag">— Balcão</span></span>
      <div class="balcao-header__acoes">
        <span class="balcao-header__contador">Pedidos pendentes: <strong id="contadorPedidos">0</strong></span>
        <button class="btn btn--secondary balcao-header__historico" id="historicoBtn">Histórico</button>
      </div>
    </nav>
  </header>

  <!-- ===== FILA DE PEDIDOS ===== -->
  <main class="balcao-main container">
    <div class="fechamento-grid" id="fechamentoGrid">
      <!-- Cards de fechamento de conta gerados via JS -->
    </div>
    <p class="balcao-vazio" id="balcaoVazio">Nenhum pedido pendente no momento.</p>
    <div class="balcao-grid" id="balcaoGrid">
      <!-- Cards de pedido gerados via JS -->
    </div>
  </main>

  <!-- ===== MODAL: HISTÓRICO DE PEDIDOS ===== -->
  <div class="modal-overlay" id="historicoOverlay"></div>
  <div class="modal-panel modal-panel--historico" id="historicoModal" role="dialog" aria-modal="true" aria-labelledby="historicoTitulo">
    <div class="modal-panel__header">
      <span class="modal-panel__title" id="historicoTitulo">Histórico de Pedidos</span>
      <button class="modal-panel__close" id="historicoClose" aria-label="Fechar">&times;</button>
    </div>
    <div class="modal-panel__filtro">
      <label for="historicoFiltroData">Filtrar por data:</label>
      <input type="date" id="historicoFiltroData">
      <button class="modal-panel__filtro-limpar" id="historicoFiltroLimpar" type="button">Limpar</button>
    </div>
    <p class="modal-panel__vazio" id="historicoVazio">Nenhum pedido registrado ainda.</p>
    <div class="modal-panel__itens" id="historicoLista"></div>
  </div>

  <script src="balcao.js"></script>
</body>
</html>
