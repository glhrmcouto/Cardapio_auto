name: Backup diário do banco (Supabase)

# ========================================================================
# Faz um pg_dump do schema "public" do Postgres do Supabase (produtos,
# pedidos, pedido_itens, mesas, perfis — tudo que as migrações em
# supabase/*.sql criaram) e guarda o resultado comprimido como artifact
# do próprio workflow, por 30 dias.
#
# Não inclui os schemas internos do Supabase (auth, storage, realtime...)
# de propósito: não são "seus dados" pra recuperar, e o schema "auth" em
# especial guarda hash de senha — não faz sentido esse backup carregar
# isso. Se o projeto Supabase inteiro precisar ser recriado do zero, os
# 2-3 logins de admin/balcão são recadastrados manualmente (ver
# supabase/003_admin.sql) — bem mais barato que arriscar credenciais
# num artifact baixável.
#
# A connection string do banco (com a senha dentro) fica SÓ no secret
# SUPABASE_DB_URL do repositório — nunca commitada aqui. Veja o passo a
# passo de como pegar e cadastrar esse secret na resposta que acompanha
# este arquivo (ou pergunte de novo: "como cadastro o SUPABASE_DB_URL?").
# ========================================================================

on:
  schedule:
    # 5h no horário de Brasília. Brasil não observa horário de verão desde
    # 2019, então BRT = UTC-3 o ano inteiro -> 5h BRT = 8h UTC.
    # (o agendamento do GitHub Actions não é exato ao minuto sob carga alta
    # da plataforma — um atraso de alguns minutos é normal e não é bug.)
    - cron: '0 8 * * *'
  workflow_dispatch: # permite rodar na hora, manualmente, pela aba "Actions" do GitHub — útil pra testar

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Rodar pg_dump (schema "public") via Docker
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::O secret SUPABASE_DB_URL não está cadastrado neste repositório (Settings > Secrets and variables > Actions > New repository secret)."
            exit 1
          fi

          # postgres:17 só pra ter um pg_dump atual disponível (o runner do
          # GitHub não vem com um cliente Postgres recente pré-instalado);
          # --user evita que o dump saia com dono "root" no arquivo do runner.
          #
          # bash -c com "set -euo pipefail" (não "sh -c"): num pipe
          # "pg_dump | gzip", o status de saída do sh -c é o do ÚLTIMO
          # comando (gzip). Se o pg_dump falhar (secret errado/expirado,
          # banco fora do ar etc.) ele sai sem escrever nada, mas o gzip
          # recebe EOF na hora e gera um .gz "válido" só que vazio (20
          # bytes) com exit code 0 — o workflow reporta sucesso e sobe um
          # backup vazio sem ninguém perceber. pipefail propaga o erro do
          # pg_dump pro sh -c e falha o step de verdade.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e SUPABASE_DB_URL \
            -v "$PWD:/backup" \
            postgres:17 \
            bash -c 'set -euo pipefail; pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges | gzip > /backup/backup.sql.gz'

          nome_arquivo="backup-aooba-$(date +%F).sql.gz"
          mv backup.sql.gz "$nome_arquivo"
          echo "NOME_ARQUIVO=$nome_arquivo" >> "$GITHUB_ENV"

          # sanidade extra: gzip de saída vazia sempre dá exatamente 20
          # bytes, então isso pega até um pg_dump que "funcionou" mas não
          # despejou nenhuma linha de dado.
          tamanho=$(stat -c%s "$nome_arquivo")
          if [ "$tamanho" -le 20 ]; then
            echo "::error::O backup saiu vazio (arquivo de $tamanho bytes) — o pg_dump não retornou dados. Confira o secret SUPABASE_DB_URL e a conectividade com o banco."
            exit 1
          fi

      - name: Guardar backup como artifact (retenção de 30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME_ARQUIVO }}
          path: ${{ env.NOME_ARQUIVO }}
          retention-days: 30
          if-no-files-found: error
